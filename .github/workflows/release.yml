# Ao enviar uma tag vX.Y.Z: testa, publica o .exe e cria o release no GitHub com o .zip.
# As notas vêm da seção "## X.Y.Z" do CHANGELOG.md.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Conferir versão da tag com o csproj
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $csproj = [xml](Get-Content src/trashsweepr/trashsweepr.csproj -Raw)
          $version = ($csproj.Project.PropertyGroup | Where-Object Version).Version
          if ($tag -ne $version) { throw "Tag $tag diferente da <Version> do csproj ($version)." }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Testes
        run: dotnet test trashsweepr.sln -c Release

      - name: Publish
        run: dotnet publish src/trashsweepr/trashsweepr.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o publish

      - name: Empacotar
        shell: pwsh
        run: |
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Copy-Item README.md publish/
          Compress-Archive -Path publish/* -DestinationPath "trashsweepr-$env:VERSION-win-x64.zip"

      - name: Notas do release
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $pattern = "(?ms)^## $([regex]::Escape($env:VERSION))\b[^\n]*\n(.*?)(?=^## |\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) { throw "CHANGELOG.md sem a seção ## $env:VERSION." }
          Set-Content release-notes.md $match.Groups[1].Value.Trim() -Encoding utf8

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "trashsweepr-${{ env.VERSION }}-win-x64.zip" --title "trashsweepr ${{ env.VERSION }}" --notes-file release-notes.md
